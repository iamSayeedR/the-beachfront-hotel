  </g>
  
  <!-- TBH Monogram in Burgundy -->
  <text x="32" y="47" font-family="Georgia, 'Playfair Display', serif" font-size="22" font-weight="700" letter-spacing="1.2" fill="#7A2332" text-anchor="middle">TBH</text>
