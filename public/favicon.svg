  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#7A2332" stroke-width="1.5" stroke-opacity="0.25" />
  
  <!-- 3 Stars -->
  <g fill="#7A2332" font-size="9" text-anchor="middle">
